replicaCount: 2

image:
  repository: oidc-provider
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  port: 8080

ingress:
  enabled: true
  className: nginx
  host: idp.example.com
  tls:
    enabled: true
    secretName: oidc-provider-tls

resources:
  requests: { cpu: 250m, memory: 256Mi }
  limits: { cpu: "1", memory: 512Mi }

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

# Non-secret configuration.
config:
  issuer: "https://idp.example.com/"
  signingMode: "Kms"          # Kms in prod; Dev only for local
  kmsRegion: "us-east-1"
  otlpEndpoint: ""            # e.g. http://otel-collector:4317

# Secrets — supply via --set / CI / external-secrets; DO NOT commit real values.
# Leave empty to reference an existing pre-created secret via existingSecret instead.
secrets:
  create: true
  existingSecret: ""
  postgres: ""               # Host=...;Database=oidc;Username=...;Password=...
  redis: ""                  # host:6379
  ppidKeyBase64: ""          # stable 32-byte base64 (pairwise sub derivation)
  encryptionKeyBase64: ""    # stable token-encryption key
  registrationInitialAccessToken: ""
  adminApiKey: ""
