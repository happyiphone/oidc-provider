{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "oidc-provider.fullname" . }}
  labels:
    {{- include "oidc-provider.labels" . | nindent 4 }}
type: Opaque
stringData:
  ConnectionStrings__Postgres: {{ .Values.secrets.postgres | quote }}
  ConnectionStrings__Redis: {{ .Values.secrets.redis | quote }}
  Oidc__PpidKeyBase64: {{ .Values.secrets.ppidKeyBase64 | quote }}
  Oidc__Signing__EncryptionKeyBase64: {{ .Values.secrets.encryptionKeyBase64 | quote }}
  Oidc__Registration__InitialAccessToken: {{ .Values.secrets.registrationInitialAccessToken | quote }}
  Oidc__Admin__ApiKey: {{ .Values.secrets.adminApiKey | quote }}
{{- end }}
