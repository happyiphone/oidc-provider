apiVersion: v1
kind: Service
metadata:
  name: {{ include "oidc-provider.fullname" . }}
  labels:
    {{- include "oidc-provider.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "oidc-provider.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
