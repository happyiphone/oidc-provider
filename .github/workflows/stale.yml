name: Stale

on:
  schedule:
    - cron: "30 1 * * *" # daily 01:30 UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v10
        with:
          days-before-stale: 45
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: "security,pinned,roadmap"
          exempt-pr-labels: "security,pinned,dependencies"
          stale-issue-message: "No activity for 45 days — marking stale; closes in 14 days if nothing changes."
          stale-pr-message: "No activity for 45 days — marking stale; closes in 14 days if nothing changes."
