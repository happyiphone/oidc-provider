name: CodeQL

# Static analysis (SAST) for C#. Free on this PUBLIC repo — runs on pushes/PRs to the default
# branch and weekly. Results appear under the repo's Security → Code scanning tab.
on:
  push:
    branches: [oidc-provider, main]
  pull_request:
    branches: [oidc-provider, main]
  schedule:
    - cron: "27 3 * * 1" # Mondays 03:27 UTC
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
          # security-focused (drops pure code-quality/maintainability notes that aren't vulns)
          queries: security-extended
      - run: dotnet build app/OidcProvider.sln -c Release
      - uses: github/codeql-action/analyze@v3
