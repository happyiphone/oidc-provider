name: CodeQL

# Static analysis (SAST) for C#. Code scanning is free on PUBLIC repos; on a PRIVATE repo it needs
# GitHub Advanced Security (confirmed unavailable on this plan — "Advanced security has not been
# purchased"). Kept MANUAL-only so it never auto-fails on the private repo; once the repo is public
# or GHAS is enabled, add `push:`/`pull_request:` (and a weekly `schedule:`) triggers.
on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
          queries: security-and-quality
      - run: dotnet build app/OidcProvider.sln -c Release
      - uses: github/codeql-action/analyze@v3
