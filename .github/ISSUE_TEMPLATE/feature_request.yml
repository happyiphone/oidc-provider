name: Feature request
description: Propose a capability, spec, or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: If it's a spec (RFC / OIDC extension), link it.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
